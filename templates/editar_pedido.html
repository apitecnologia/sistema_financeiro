<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pedido</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1 class="header-text">Editar Pedido</h1>
    <a href="{{ url_for('pedidos') }}" class="back-link">← Voltar para Pedidos</a>
    <hr>

    <form method="POST" class="form-section">
        <label for="numero_pedido">Número do Pedido:</label>
        <input type="text" id="numero_pedido" name="numero_pedido" value="{{ pedido.numero_pedido }}" required>

        <label for="cliente_nome">Nome do Cliente:</label>
        <input type="text" id="cliente_nome" name="cliente_nome" value="{{ pedido.cliente_nome }}" required>
        
        <label for="valor_display">Valor Total:</label>
        <div style="display: flex; align-items: center; gap: 5px;">
            <span style="font-size: 1em;">R$</span>
            <input type="text" id="valor_display" placeholder="123,45" value="{{ '%.2f'|format(pedido.valor_total)|replace('.', ',') }}" required style="flex-grow: 1;" inputmode="decimal">
            <input type="hidden" id="valor" name="valor" value="{{ pedido.valor_total }}">
        </div>

        <label for="forma_pagamento" style="margin-top: 10px;">Forma de Pagamento:</label>
        <select id="forma_pagamento" name="forma_pagamento" required>
            <option value="A Vista" {% if pedido.forma_pagamento == 'A Vista' %}selected{% endif %}>À Vista</option>
            <option value="A Prazo" {% if pedido.forma_pagamento == 'A Prazo' %}selected{% endif %}>À Prazo</option>
        </select>

        <div id="parcelas_container" style="display: none;">
            <label for="num_parcelas">Número de Parcelas:</label>
            <select id="num_parcelas" name="num_parcelas">
                {% for i in range(1, 13) %}
                <option value="{{ i }}" {% if i == pedido.num_parcelas %}selected{% endif %}>{{ i }}x</option>
                {% endfor %}
            </select>
        </div>
        
        <label for="data_vencimento">Data de Vencimento (1ª Parcela):</label>
        <input type="date" id="data_vencimento" name="data_vencimento" value="{{ data_vencimento_inicial.isoformat() }}" required>

        <button type="submit" style="margin-top: 20px;">Salvar Alterações</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        // --- Script para máscara de moeda ---
        const valorDisplay = document.getElementById('valor_display');
        const valorHidden = document.getElementById('valor');

        valorDisplay.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value) {
                let numberValue = parseInt(value, 10) / 100;
                let formattedValue = numberValue.toLocaleString('pt-BR', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
                e.target.value = formattedValue;
                valorHidden.value = numberValue.toFixed(2);
            } else {
                e.target.value = '';
                valorHidden.value = '';
            }
        });

        // --- Script para mostrar/ocultar parcelas (copiado de pedidos.html) ---
        const formaPagamentoSelect = document.getElementById('forma_pagamento');
        const parcelasContainer = document.getElementById('parcelas_container');
        
        function toggleParcelas() {
            if (formaPagamentoSelect.value === 'A Prazo') {
                parcelasContainer.style.display = 'block';
            } else {
                parcelasContainer.style.display = 'none';
            }
        }
        
        // Adiciona o listener
        formaPagamentoSelect.addEventListener('change', toggleParcelas);
        
        // Executa a função na carga da página para definir o estado inicial correto
        toggleParcelas();
    });
</script>

</body>
</html>
